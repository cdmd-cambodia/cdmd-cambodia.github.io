# ---------------- HOME ----------------
home:
  name_html: '<span class="init">C</span>ambodian <span class="init">D</span>evelopment<br><span class="init">M</span>ission for <span class="init">D</span>isability'
  intro: "Many persons with disabilities in Cambodia remain excluded from school, work, and community life. CDMD works with government and community partners to change this."
  hero_button: "Explore Our Work"
  hero_photo: "/assets/images/hero-community.jpg"
  hero_photo_alt: "Activity or community scene"
  tagline: "Opening pathways to education, work, and dignified lives for persons with disabilities and their families in Cambodia."
  glance_title: "Disability in Cambodia at a Glance"
  glance_intro: "About 2.8% of people aged 5 and over in Cambodia have a disability, and around one in ten households includes at least one person with a disability. Disability here means having a lot of difficulty with, or being unable to do, at least one of six basic activities, such as seeing or walking (Washington Group Short Set)."
  charts:
    - title: "Children aged 6–18 currently in school"
      placeholder: false
      bars:
        - label: "Without disability"
          value: 82
          display: "82%"
        - label: "With disability"
          value: 33
          display: "33%"
      takeaway: "Only one in three children with a disability is in school, and more than half have never attended."
      source: "Cambodia Inter-Censal Population Survey (CIPS) 2024. Weighted estimates."
    - title: "Adults aged 15–64 who are employed"
      placeholder: false
      bars:
        - label: "Without disability"
          value: 80
          display: "80%"
        - label: "With disability"
          value: 47
          display: "47%"
      takeaway: "Fewer than half of adults with a disability are employed, and only one in six works as a paid employee."
      source: "Cambodia Inter-Censal Population Survey (CIPS) 2024. Weighted estimates."
    - title: "Households holding IDPoor status"
      placeholder: false
      bars:
        - label: "No member with disability"
          value: 18
          display: "18%"
        - label: "At least one member with disability"
          value: 28
          display: "28%"
      takeaway: "Households with a member with a disability are more likely to hold IDPoor status, even at similar wealth levels."
      source: "Cambodia Inter-Censal Population Survey (CIPS) 2024. IDPoor status includes Poor 1 and Poor 2. Weighted estimates."
  cta_title: "Interested in working with us?"
  cta_text: "We welcome partners, researchers, and colleagues who share our commitment to inclusion."
  cta_button: "Join Us"

# ---------------- ABOUT US ----------------
about:
  guides_title: "What Guides Us"
  vision_label: "Our Vision"
  vision: "A Cambodia where persons with disabilities learn, work, and live with dignity."
  mission_label: "Our Mission"
  mission: "CDMD supports persons with disabilities and their families in Cambodia. We open pathways to education, decent work, and secure livelihoods. We work hand in hand with government and community partners, and we use evidence to improve what we do."
  values_label: "Our Values"
  values:
    - icon: dignity
      name: "Dignity"
      text: "We see persons with disabilities as active members of society, not as recipients of charity."
    - icon: participation
      name: "Participation"
      text: "We involve persons with disabilities and their families in designing and implementing our work."
    - icon: evidence
      name: "Evidence"
      text: "We measure our results honestly and learn from them, so that resources go to what works."
    - icon: partnership
      name: "Partnership"
      text: "We work with government, schools, and communities to strengthen existing systems."
    - icon: integrity
      name: "Integrity"
      text: "We manage funds transparently and protect the privacy and safety of the people we serve."
  message_title: "Message from the Executive Director"
  director_name: Nhip Thy
  director_title: "Executive Director"
  director_photo: "/assets/images/director.png"
  director_photo_alt: "Portrait of the Executive Director"
  message_intro: |
    Welcome to the Cambodian Development Mission for Disability (CDMD).

    I have more than 30 years of experience in disability inclusion, community development, and NGO leadership. Throughout this time, I have dedicated my professional journey to promoting the rights, dignity, and opportunities of persons with disabilities in Cambodia. This experience has strengthened my belief that every person, regardless of disability, deserves equal opportunities to learn, work, participate, and live independently.
  message_rest: |
    Despite progress in disability rights and inclusive development in Cambodia, many persons with disabilities continue to face significant barriers. These include limited access to quality education, healthcare, rehabilitation, employment, social protection, and accessible public facilities. Children and young people with disabilities are particularly at risk of exclusion from education. In addition, adults often encounter limited livelihood opportunities and barriers to full participation in their communities. Addressing these challenges requires stronger policies, inclusive services, community awareness, and meaningful participation of persons with disabilities in decisions that affect their lives.

    Since its beginnings in 1993 and formal registration on 22 December 2006, CDMD has remained committed to empowering persons with disabilities and building more inclusive communities. Our work focuses on four key areas: inclusive education, employment and livelihoods, support for families, and research to inform policy and practice.

    We believe that persons with disabilities are not merely recipients of support, but active contributors, decision-makers, and leaders in their communities. Meaningful inclusion requires strong partnerships, local ownership, and the active participation of persons with disabilities themselves.

    As CDMD enters a new chapter, we remain committed to breaking down barriers, creating opportunities, and strengthening communities. We will continue working with government institutions, development partners, civil society, and the private sector to build a more inclusive Cambodia.

    I warmly invite you to join us in this journey. Together, we can make a difference and ensure that no one is left behind.

    Thank you for your interest and support.
  story_title: "Our Story"
  story:
    - year: "1993"
      text: "CDMD's roots lie in Rehabilitation for Blind Cambodians – Community-Based Rehabilitation (RBC-CBR). The initiative was first supported by international organizations, including Maryknoll Sisters and Caritas."
    - year: "1993–2006"
      text: "The initiative gradually built local capacity, expertise, and community-based networks, particularly in rural Cambodia."
    - year: "2006"
      text: "On 22 December 2006, CDMD was formally registered as a Cambodian NGO with the Ministry of Interior."
    - year: "2007"
      text: "CDMD began operating as an independent Cambodian organization, committed to locally led disability inclusion."
    - year: "Today"
      text: "Building on more than three decades of community-based rehabilitation experience, CDMD continues to work alongside persons with disabilities, their families, communities, and government institutions. Our work is guided by the principle \"Nothing About Us Without Us.\""

# ---------------- OUR WORK ----------------
# The four themes also appear as cards on the Home page.
