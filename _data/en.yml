    - id: family
      title: "Family Support"
      summary: "We support families of persons with disabilities to stay economically secure."
      photo: "/assets/images/family-support.jpg"
      photo_alt: "Family activity"
      problem: "Households with a member with a disability face extra costs and lost income. Caregiving often keeps family members out of paid work, and siblings may leave school to help at home. CDMD helps families access social protection and supports them in keeping all their children in school."
      activities:
        - "Linking families to social protection"
        - "Caregiver support"
        - "Keeping siblings in school"
