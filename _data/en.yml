      title: "Employment Support"
      summary: "We provide skills training and employment support for persons with disabilities."
      photo: "/assets/images/employment-support.jpg"
      photo_alt: "Skills training session"
      problem: "Adults with disabilities face barriers to skills and decent work. Many have had limited access to education and vocational training, and employers are often unaware of their abilities. CDMD provides skills training and works with employers to help persons with disabilities find and keep decent jobs."
      activities:
        - "Vocational skills training"
