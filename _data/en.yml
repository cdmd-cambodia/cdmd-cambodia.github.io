      photo_alt: "Survey data collection"
      problem: "Reliable data on persons with disabilities in Cambodia remain limited. Without good evidence, it is difficult to design policies and programs that reach those who need them most. CDMD collects high-quality data, evaluates what works, and shares the findings with government partners and the research community."
